grafana_org_users:
  query: "SELECT role, COUNT(user_id) AS total FROM org_user GROUP BY role;"
  metrics:
    - role:
        usage: "LABEL"
        description: "Role of the user (Admin, Editor, Viewer)"
    - total:
        usage: "GAUGE"
        description: "Total number of users per role"

pg_replication_lag_custom:
  query: "SELECT CASE WHEN NOT pg_is_in_recovery() THEN 0 ELSE EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp())) END AS lag"
  master: true
  metrics:
    - lag:
        usage: "GAUGE"
        description: "Replication lag in seconds"

pg_table_bloat_estimate:
  query: |
    SELECT schemaname, relname, n_dead_tup, n_live_tup
    FROM pg_stat_user_tables
  metrics:
    - schemaname:
        usage: "LABEL"
        description: "Schema"
    - relname:
        usage: "LABEL"
        description: "Table"
    - n_dead_tup:
        usage: "GAUGE"
        description: "Dead tuples"
    - n_live_tup:
        usage: "GAUGE"
        description: "Live tuples"

pg_dr_replication:
  query: |
    SELECT
      current_database() AS database,
      application_name,
      state,
      COALESCE(EXTRACT(EPOCH FROM write_lag), 0)::double precision  AS write_lag_seconds,
      COALESCE(EXTRACT(EPOCH FROM flush_lag), 0)::double precision  AS flush_lag_seconds,
      COALESCE(EXTRACT(EPOCH FROM replay_lag), 0)::double precision AS replay_lag_seconds
    FROM pg_stat_replication
  metrics:
    - database:          { usage: "LABEL" }
    - application_name:  { usage: "LABEL" }
    - state:             { usage: "LABEL" }
    - write_lag_seconds: { usage: "GAUGE" }
    - flush_lag_seconds: { usage: "GAUGE" }
    - replay_lag_seconds:{ usage: "GAUGE" }

